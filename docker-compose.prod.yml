
networks:
  backend_net:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: smartaccountingai-redis-prod
    restart: always
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-http-proxy:
    image: hiett/serverless-redis-http:latest
    container_name: smartaccountingai-redis-http-prod
    restart: always
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${REDIS_HTTP_TOKEN:?REDIS_HTTP_TOKEN must be set}
      - SRH_CONNECTION_STRING=redis://redis:6379
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15.6-alpine
    container_name: smartaccountingai-db-prod
    restart: always
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartaccountingai-app-prod
    restart: always
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    ports:
      - "3000:3000"
    volumes:
      - private_uploads:/app/private_uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL must be set}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DOCUMENT_PROCESSOR_PROVIDER=${DOCUMENT_PROCESSOR_PROVIDER:-}
      - DOCUMENT_PROCESSOR_MODEL=${DOCUMENT_PROCESSOR_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OCR_SERVICE_URL=http://ocr-service:8000/extract
      - UPSTASH_REDIS_REST_URL=http://redis-http-proxy:80
      - UPSTASH_REDIS_REST_TOKEN=${REDIS_HTTP_TOKEN:?REDIS_HTTP_TOKEN must be set}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis-http-proxy:
        condition: service_healthy
      ocr-service:
        condition: service_healthy

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: smartaccountingai-ocr-prod
    restart: always
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2.5G
    healthcheck:
      test: ["CMD-SHELL", "python /app/healthcheck.py || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: smartaccountingai-db-backup
    restart: always
    networks:
      - backend_net
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres_backups_prod:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_prod:
  postgres_backups_prod:
  private_uploads:
