version: "3.8"

networks:
  backend_net:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: smartaccountingai-redis-prod
    restart: always
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-http-proxy:
    image: hiett/serverless-redis-http:latest
    container_name: smartaccountingai-redis-http-prod
    restart: always
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=supersecret_redis_token
      - SRH_CONNECTION_STRING=redis://redis:6379
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15.6-alpine
    container_name: smartaccountingai-db-prod
    restart: always
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartaccountingai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartaccountingai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartaccountingai-app-prod
    restart: always
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/smartaccountingai?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-supersecretkey}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - UPSTASH_REDIS_REST_URL=http://redis-http-proxy:80
      - UPSTASH_REDIS_REST_TOKEN=supersecret_redis_token
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis-http-proxy:
        condition: service_started

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: smartaccountingai-db-backup
    restart: always
    networks:
      - backend_net
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-smartaccountingai}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres_backups_prod:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_prod:
  postgres_backups_prod:
