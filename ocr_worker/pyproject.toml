[project]
name = "ocr-worker"
version = "0.1.0"
description = "OCR Worker using Doctr"
requires-python = "==3.12.10"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-doctr"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
python-doctr = { path = "../doctr", editable = true }
